<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="theme-color" content="#0e1013" />
<title>MASTER</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="wrap">

  <header class="bar">
    <div class="id">
      <span class="dot" id="statusDot"></span>
      <span class="name">MASTER</span>
    </div>
    <button class="iconbtn" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <main class="stream" id="stream">
    <div class="intro">
      <p class="introTitle">MASTER online.</p>
      <p class="introSub">Bol ya likh — main sun raha hoon.</p>
    </div>
  </main>

  <form class="inputBar" id="inputForm">
    <button type="button" class="mic" id="micBtn" title="Voice input" aria-label="Voice input">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
    <input type="text" id="textInput" placeholder="Message MASTER…" autocomplete="off" />
    <button type="submit" class="send" id="sendBtn" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 11.5 21 3l-6.5 18-3.2-7.3L3 11.5Z"/></svg>
    </button>
  </form>

</div>

<div class="modal" id="settingsModal">
  <div class="modalCard">
    <h2>Settings</h2>
    <label class="field">
      <span>Webhook URL</span>
      <input type="text" id="webhookInput" spellcheck="false" />
    </label>
    <label class="field">
      <span>Voice reply</span>
      <select id="voiceToggle">
        <option value="on">On</option>
        <option value="off">Off</option>
      </select>
    </label>
    <label class="field">
      <span>Listening language</span>
      <select id="langToggle">
        <option value="hi-IN">Hindi</option>
        <option value="en-IN">English</option>
      </select>
    </label>
    <div class="modalActions">
      <button type="button" class="ghost" id="resetChatBtn">Clear chat</button>
      <button type="button" class="primary" id="saveSettingsBtn">Save</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
