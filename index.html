<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MASTER AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- ==============================
         SIDEBAR
    =============================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="logo">
        MASTER AI
      </div>

      <button
        class="new-chat"
        id="newChatButton"
        type="button"
      >
        ＋ New Chat
      </button>


      <div class="history">

        <div class="section-title">
          Chat History
        </div>

        <div
          class="history-list"
          id="historyList"
        ></div>

      </div>


      <div class="projects">

        <div class="section-title">
          Projects
        </div>

        <div
          class="project-list"
          id="projectList"
        ></div>

        <button
          class="project-item create-project"
          id="createProjectButton"
          type="button"
        >
          ＋ Create Project
        </button>

      </div>


      <div class="sidebar-bottom">

        <button
          class="settings-button"
          id="settingsButton"
          type="button"
        >
          ⚙ Settings
        </button>

      </div>

    </aside>


    <!-- ==============================
         MAIN
    =============================== -->

    <main class="main">


      <!-- TOPBAR -->

      <header class="topbar">

        <button
          class="menu-button"
          id="menuButton"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>

        <strong>
          MASTER AI
        </strong>

        <span
          class="status"
          id="connectionStatus"
        >
          Ready
        </span>

      </header>


      <!-- CONTENT -->

      <div class="content">


        <!-- CHAT -->

        <section
          class="chat"
          id="chat"
        >

          <div
            class="welcome"
            id="welcomeScreen"
          >

            <h1>
              MASTER AI
            </h1>

            <p>
              Type a message or talk using Voice AI.
            </p>

          </div>

        </section>


        <!-- PREVIEW -->

        <aside class="canvas">

          <div class="canvas-header">

            <span class="canvas-title">
              Preview
            </span>

          </div>

          <div
            class="preview"
            id="preview"
          >
            Preview output will appear here.
          </div>

        </aside>

      </div>


      <!-- ==============================
           VOICE AI
      =============================== -->

      <section
        class="voice-panel"
        id="voicePanel"
      >

        <div
          class="voice-circle"
          id="voiceCircle"
          role="button"
          tabindex="0"
          aria-label="Talk to MASTER AI"
        >

          <div class="voice-core"></div>

        </div>

        <div
          class="voice-status"
          id="voiceStatus"
        >
          Tap the circle to speak
        </div>

        <button
          class="voice-button"
          id="voiceButton"
          type="button"
        >
          🎙 Talk to MASTER
        </button>

      </section>


      <!-- ==============================
           INPUT
      =============================== -->

      <section class="input-area">

        <div
          class="attachment-name"
          id="attachmentName"
        ></div>


        <div class="input-box">

          <button
            class="attach"
            id="attachButton"
            type="button"
            aria-label="Attach files"
          >
            📎
          </button>


          <input
            type="file"
            id="fileInput"
            multiple
            hidden
          >


          <div class="input-wrap">

            <input
              id="messageInput"
              type="text"
              placeholder="Message MASTER AI..."
              autocomplete="off"
            >

          </div>


          <button
            class="send"
            id="sendButton"
            type="button"
            aria-label="Send message"
          >
            ↑
          </button>

        </div>

      </section>


    </main>

  </div>


  <!-- ==============================
       SETTINGS MODAL
  =============================== -->

  <div
    class="modal"
    id="settingsModal"
    aria-hidden="true"
  >

    <div
      class="modal-box settings-box"
      role="dialog"
      aria-modal="true"
    >

      <div class="settings-header">

        <h2>
          Settings
        </h2>

        <button
          id="closeSettingsButton"
          type="button"
          aria-label="Close settings"
        >
          ×
        </button>

      </div>


      <p class="settings-note">

        API settings and MASTER AI
        configuration.

      </p>


      <label for="providerSelect">
        API Provider
      </label>

      <select id="providerSelect">

        <option value="deepseek">
          DeepSeek
        </option>

        <option value="openai">
          OpenAI
        </option>

        <option value="gemini">
          Gemini
        </option>

        <option value="custom">
          Custom API
        </option>

      </select>


      <label for="apiUrlInput">
        API URL
      </label>

      <input
        id="apiUrlInput"
        type="text"
        placeholder="API URL"
      >


      <label for="modelInput">
        Model
      </label>

      <input
        id="modelInput"
        type="text"
        placeholder="Model name"
      >


      <label for="apiKeyInput">
        API Key
      </label>

      <input
        id="apiKeyInput"
        type="password"
        placeholder="Paste API key"
        autocomplete="off"
      >


      <button
        class="save-provider"
        id="saveProviderButton"
        type="button"
      >
        Save API Settings
      </button>


      <div
        class="settings-status"
        id="settingsStatus"
      ></div>


      <hr>


      <h3>
        Memory
      </h3>

      <p class="settings-note">
        Clear remembered information stored
        in this browser.
      </p>


      <button
        class="save-provider"
        id="clearMemoryButton"
        type="button"
      >
        Clear Memory
      </button>

    </div>

  </div>


  <!-- ==============================
       PROJECT MODAL
  =============================== -->

  <div
    class="modal"
    id="projectModal"
  >

    <div
      class="modal-box"
      role="dialog"
      aria-modal="true"
    >

      <h2>
        Create Project
      </h2>


      <label for="projectNameInput">
        Project Name
      </label>


      <input
        id="projectNameInput"
        type="text"
        placeholder="My new project"
      >


      <div class="modal-actions">

        <button
          id="cancelProjectButton"
          type="button"
        >
          Cancel
        </button>


        <button
          id="saveProjectButton"
          type="button"
        >
          Create
        </button>

      </div>

    </div>

  </div>


  <!-- ==============================
       SCRIPTS

       Order is important:
       Config → Intelligence → App
  =============================== -->

  <script src="api-config.js"></script>

  <script src="mastermind.js"></script>

  <script src="app.js"></script>

</body>
</html>
