<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MASTER — Personal AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <aside class="sidebar">

      <div class="logo">
        MASTER
      </div>

      <button class="new-chat">
        ＋ New Chat
      </button>

      <div class="history">

        <div class="section-title">
          History
        </div>

        <div class="history-item">
          Welcome to MASTER
        </div>

        <div class="history-item">
          My first project
        </div>

      </div>

      <div class="projects">

        <div class="section-title">
          Projects
        </div>

        <div class="history-item">
          ＋ Create Project
        </div>

      </div>

    </aside>


    <main class="main">

      <header class="topbar">

        <strong>
          MASTER
        </strong>

        <span class="status">
          Personal AI
        </span>

      </header>


      <div class="content">

        <section class="chat">

          <div class="welcome">

            <h1>
              How can I help?
            </h1>

            <p>
              I'm MASTER, your personal AI workspace.
              Ask, create, analyse, build and explore.
            </p>

          </div>

        </section>


        <aside class="canvas">

          <div class="canvas-header">

            <span class="canvas-title">
              Canvas
            </span>

            <span>
              Preview
            </span>

          </div>

          <div class="preview">
            Your work will appear here
          </div>

        </aside>

      </div>


      <div class="input-area">

        <div class="input-box">

          <span>
            📎
          </span>

          <input
            type="text"
            placeholder="Ask MASTER anything..."
          >

          <button class="send">
            ↑
          </button>

        </div>

      </div>

    </main>

  </div>


  <script src="app.js"></script>

</body>
</html>
