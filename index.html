<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>MASTER — Personal AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="logo">
        MASTER
      </div>

      <button class="new-chat" id="newChatButton">
        ＋ New Chat
      </button>


      <!-- HISTORY -->
      <div class="history">

        <div class="section-title">
          History
        </div>

        <div
          class="history-list"
          id="historyList"
        >
          <!-- Chats JavaScript se aayengi -->
        </div>

      </div>


      <!-- PROJECTS -->
      <div class="projects">

        <div class="section-title">
          Projects
        </div>

        <div
          class="project-list"
          id="projectList"
        >
          <!-- Projects JavaScript se aayenge -->
        </div>


        <button
          class="create-project"
          id="createProjectButton"
        >
          ＋ Create Project
        </button>

      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">


      <!-- TOP BAR -->
      <header class="topbar">

        <button
          class="menu-button"
          id="menuButton"
          aria-label="Open menu"
        >
          ☰
        </button>


        <strong id="chatTitle">
          MASTER
        </strong>


        <span class="status">
          Personal AI
        </span>

      </header>


      <!-- CONTENT -->
      <div class="content">


        <!-- CHAT -->
        <section
          class="chat"
          id="chat"
        >

          <div class="welcome">

            <h1>
              How can I help?
            </h1>

            <p>
              I'm MASTER, your personal AI workspace.
              Ask, create, analyse, build and explore.
            </p>

          </div>

        </section>


        <!-- CANVAS -->
        <aside
          class="canvas"
          id="canvas"
        >

          <div class="canvas-header">

            <span class="canvas-title">
              Canvas
            </span>

            <span id="canvasStatus">
              Preview
            </span>

          </div>


          <div
            class="preview"
            id="preview"
          >
            Your work will appear here
          </div>

        </aside>

      </div>


      <!-- INPUT -->
      <div class="input-area">

        <div class="input-box">


          <!-- FILE INPUT -->
          <input
            id="fileInput"
            type="file"
            multiple
            hidden
          >


          <!-- ATTACH -->
          <button
            class="attach"
            id="attachButton"
            type="button"
            aria-label="Attach files"
          >
            📎
          </button>


          <!-- TEXT INPUT -->
          <div class="input-wrap">

            <input
              id="messageInput"
              type="text"
              placeholder="Ask MASTER anything..."
              autocomplete="off"
            >


            <div
              class="attachment-name"
              id="attachmentName"
              aria-live="polite"
            ></div>

          </div>


          <!-- SEND -->
          <button
            class="send"
            id="sendButton"
            type="button"
            aria-label="Send message"
          >
            ↑
          </button>

        </div>

      </div>

    </main>

  </div>


  <!-- PROJECT MODAL -->
  <div
    class="modal"
    id="projectModal"
  >

    <div class="modal-box">

      <h2>
        Create Project
      </h2>

      <p>
        Give your project a name.
      </p>


      <input
        type="text"
        id="projectNameInput"
        placeholder="My Project"
      >


      <div class="modal-actions">

        <button
          class="modal-cancel"
          id="cancelProjectButton"
        >
          Cancel
        </button>


        <button
          class="modal-create"
          id="confirmProjectButton"
        >
          Create
        </button>

      </div>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
