<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>MASTER — Personal AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

      <div class="logo">
        MASTER
      </div>

      <button class="new-chat">
        ＋ New Chat
      </button>

      <div class="history">

        <div class="section-title">
          History
        </div>

        <div class="history-item">
          Welcome to MASTER
        </div>

        <div class="history-item">
          My first project
        </div>

      </div>

      <div class="projects">

        <div class="section-title">
          Projects
        </div>

        <div class="history-item">
          ＋ Create Project
        </div>

      </div>

    </aside>


    <!-- Main area -->
    <main class="main">

      <header class="topbar">

        <button
          class="menu-button"
          id="menuButton"
          aria-label="Open menu"
        >
          ☰
        </button>

        <strong>
          MASTER
        </strong>

        <span class="status">
          Personal AI
        </span>

      </header>


      <div class="content">

        <!-- Chat -->
        <section class="chat">

          <div class="welcome">

            <h1>
              How can I help?
            </h1>

            <p>
              I'm MASTER, your personal AI workspace.
              Ask, create, analyse, build and explore.
            </p>

          </div>

        </section>


        <!-- Canvas -->
        <aside class="canvas">

          <div class="canvas-header">

            <span class="canvas-title">
              Canvas
            </span>

            <span>
              Preview
            </span>

          </div>

          <div class="preview">
            Your work will appear here
          </div>

        </aside>

      </div>


      <!-- Input -->
      <div class="input-area">

        <div class="input-box">

          <input
            id="fileInput"
            type="file"
            hidden
          >

          <button
            class="attach"
            type="button"
            aria-label="Attach file"
          >
            📎
          </button>


          <div class="input-wrap">

            <input
              type="text"
              placeholder="Ask MASTER anything..."
              autocomplete="off"
            >

            <div
              class="attachment-name"
              aria-live="polite"
            ></div>

          </div>


          <button
            class="send"
            type="button"
            aria-label="Send message"
          >
            ↑
          </button>

        </div>

      </div>

    </main>

  </div>


  <script src="app.js"></script>

</body>
</html>
