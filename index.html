<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASTER — Personal AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d0d0f;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: #141416;
      border-right: 1px solid #29292d;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 1px solid #3a3a3f;
      border-radius: 10px;
      background: #202024;
      color: white;
      font-size: 15px;
    }

    .section-title {
      color: #8d8d96;
      font-size: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .history-item {
      padding: 10px;
      color: #c8c8cc;
      border-radius: 8px;
      font-size: 14px;
    }

    .history-item:hover {
      background: #202024;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid #29292d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }

    .status {
      color: #9b9ba3;
      font-size: 14px;
    }

    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .chat {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    .welcome {
      max-width: 700px;
      margin: 60px auto;
    }

    .welcome h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #9c9ca4;
      line-height: 1.6;
    }

    .canvas {
      width: 42%;
      border-left: 1px solid #29292d;
      background: #111113;
      padding: 20px;
    }

    .canvas-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .canvas-title {
      font-weight: bold;
    }

    .preview {
      height: 85%;
      border: 1px dashed #3a3a40;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777780;
    }

    .input-area {
      padding: 20px 30px;
      border-top: 1px solid #29292d;
    }

    .input-box {
      background: #202024;
      border: 1px solid #34343a;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
    }

    button.send {
      background: white;
      color: black;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 9px;
      font-size: 18px;
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 70px;
        padding: 12px;
      }

      .logo {
        font-size: 14px;
      }

      .history,
      .projects,
      .new-chat {
        display: none;
      }

      .canvas {
        display: none;
      }

      .chat {
        padding: 25px 18px;
      }

      .welcome {
        margin: 30px auto;
      }

      .welcome h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">MASTER</div>

    <button class="new-chat">＋ New Chat</button>

    <div class="history">
      <div class="section-title">History</div>
      <div class="history-item">Welcome to MASTER</div>
      <div class="history-item">My first project</div>
    </div>

    <div class="projects">
      <div class="section-title">Projects</div>
      <div class="history-item">＋ Create Project</div>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <strong>MASTER</strong>
      <span class="status">Personal AI</span>
    </header>

    <div class="content">

      <section class="chat">
        <div class="welcome">
          <h1>How can I help?</h1>
          <p>
            I'm MASTER, your personal AI workspace.
            Ask, create, analyse, build and explore.
          </p>
        </div>
      </section>

      <aside class="canvas">
        <div class="canvas-header">
          <span class="canvas-title">Canvas</span>
          <span>Preview</span>
        </div>

        <div class="preview">
          Your work will appear here
        </div>
      </aside>

    </div>

    <div class="input-area">
      <div class="input-box">
        <span>📎</span>
        <input type="text" placeholder="Ask MASTER anything..." />
        <button class="send">↑</button>
      </div>
    </div>

  </main>

</div>

</body>
  </html>
